; RELAY + PRINTER BRIDGE  -  ESP32 WROOM-32
;
;   * ESP-NOW relay: WiFi/HTTPS/MQTT/NTP -> broadcast to the ESP32-C3 display
;   * serial (USB) -> parallel (Centronics/ESC-P) bridge for an Epson LX-810L
;   * web page + REST /print + raw TCP :9100 network printer
;
; Docs: README.md | docs/wiring.md | docs/protocol.md | ../docs/ARCHITECTURE.md

[platformio]
default_envs = esp32dev
src_dir = src

[env]
platform = espressif32 @ 6.13.0
framework = arduino
; esptool 4.11 (recent default) needs the python 'intelhex' module; 4.5.1 doesn't
platform_packages =
    platformio/tool-esptoolpy@~1.40501.0
; more app space: WiFi+TLS+MQTT+JSON+WebServer doesn't fit the default table
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; the monitor adds no line ending; the firmware normalizes CR/LF (TEXT mode)
monitor_eol = LF
monitor_filters = time, send_on_enter

lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    knolleary/PubSubClient@^2.8

build_flags =
    -I ../shared                ; canonical enow_proto.h
    -D SERIAL_BAUD=115200
    -D PRN_TEXT_MODE=1          ; 1 = normalize CR/LF/CRLF -> CRLF ; 0 = RAW (binary/ESC-P)
    -D PRN_XONXOFF=1           ; software flow control with the USB host
    -D PRN_AUTO_RESET_ON_BOOT=1 ; pulse /INIT + send "ESC @" at boot
;   -D PRN_DEBUG=1             ; diagnostics on the USB serial
;   -D PRN_NO_BANNER           ; suppress the boot banner (use in RAW mode)
;   -D RAWPRINT_RAW=1          ; port 9100 pure passthrough (for a 9-pin ESC/P driver)

; ---- default: any DevKit with an ESP32-WROOM-32 (or WROVER) ----
[env:esp32dev]
board = esp32dev

; ---- alias: DOIT ESP32 DevKit v1 (same chip) ----
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1

; ---- bench: ignore SELECT/PE/ERROR, BUSY handshake only, with logs ----
[env:bench]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -D PRN_IGNORE_STATUS=1
    -D PRN_DEBUG=1

; ---- alternative: ESP32-S3 (REVIEW the pin map in include/config.h!) ----
; [env:esp32-s3-devkitc-1]
; board = esp32-s3-devkitc-1
