<text x="15.0" y="168.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.9" fill="#111827" text-anchor="start" font-weight="normal" dominant-baseline="middle">3) the mid row touching the top row (5 V passes straight through).  Test: measure base-&gt;GND with the continuity beeper.</text>
