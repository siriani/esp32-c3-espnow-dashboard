; DISPLAY  -  ESP32-C3 + ST7735 1.44"  (128x128)
;
; This board's WiFi does not associate with normal routers (incomplete
; antenna matching network). It runs NO WiFi -- it receives everything over
; ESP-NOW from the relay ESP32. See ../README.md and
; ../docs/esp32-c3-wifi-problem.md.
;
; Adafruit_ST7735 is used instead of TFT_eSPI: TFT_eSPI 2.5.x hangs in
; tft.init() on Arduino-ESP32 core 3.x for the C3.

[env:esp32-c3-devkitm-1]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
; esptool 4.11 (the 6.13 default) needs the python 'intelhex' module; 4.5.1 doesn't
platform_packages =
	platformio/tool-esptoolpy@~1.40501.0

lib_deps =
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit GFX Library@^1.11.11

build_flags =
	-I ../shared                 ; canonical enow_proto.h
	; --- ESP32-C3 native USB CDC serial (for the monitor) ---
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; --- ST7735 pin map (Spotpear ESP32-C3-1.44inch schematic) ---
	-DPIN_TFT_SCLK=3
	-DPIN_TFT_MOSI=4
	-DPIN_TFT_CS=2
	-DPIN_TFT_DC=0
	-DPIN_TFT_RST=5
